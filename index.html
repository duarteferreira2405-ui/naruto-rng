<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naruto RNG Life Simulator</title>

<style>

body{
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
margin:0;
padding:20px;
}

h1{
color:orange;
}

#wheel{
width:300px;
height:300px;
border-radius:50%;
border:12px solid orange;
margin:20px auto;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:bold;
background:#222;
transition:transform 3s cubic-bezier(.17,.67,.19,1);
}

button{
background:orange;
color:white;
border:none;
padding:10px 15px;
margin:5px;
border-radius:10px;
font-size:15px;
cursor:pointer;
}

.panel{
max-width:900px;
margin:20px auto;
background:#1b1b1b;
padding:15px;
border-radius:12px;
}

.log{
height:250px;
overflow-y:auto;
background:black;
padding:10px;
border-radius:8px;
text-align:left;
white-space:pre-line;
}

</style>
</head>

<body>

<h1>Naruto RNG Life Simulator</h1>

<div id="wheel">SPIN</div>

<button onclick="spinClan()">Clan</button>
<button onclick="spinVillage()">Village</button>
<button onclick="spinNature()">Nature</button>
<button onclick="spinEyes()">Eyes</button>
<button onclick="spinRank()">Rank</button>
<button onclick="spinMaster()">Master</button>
<button onclick="spinFriend()">Friend</button>
<button onclick="spinRival()">Rival</button>
<button onclick="spinBeast()">Tailed Beast</button>
  <button onclick="evolveEyes()">Evolve Eyes</button>
<button onclick="nextYear()">Next Year</button>

<div class="panel">
<h2>Character</h2>
<div id="stats"></div>
</div>

<div class="panel">
<h2>Timeline</h2>
<div id="timeline" class="log"></div>
</div>

<script>
  const clans = [
"Uchiha",
"Hyuga",
"Senju",
"Uzumaki",
"Nara",
"Inuzuka",
"Aburame",
"Civilian"
];

const villages = [
"Leaf",
"Sand",
"Mist",
"Cloud",
"Stone"
];

const natures = [
"Fire",
"Water",
"Wind",
"Earth",
"Lightning"
];

const eyes = [
"No Dojutsu",
"Byakugan",
"Sharingan 1 Tomoe",
"Sharingan 2 Tomoe",
"Sharingan 3 Tomoe",
"Mangekyo Sharingan",
"Eternal Mangekyo Sharingan",
"Rinnegan"
];

const ranks = [
"Academy Student",
"Genin",
"Chunin",
"Jonin",
"ANBU",
"Kage Candidate"
];

const masters = [
"Kakashi",
"Jiraiya",
"Tsunade",
"Orochimaru",
"Might Guy",
"Minato",
"Itachi",
"Hagoromo"
];

const friends = [
"Naruto",
"Sasuke",
"Sakura",
"Hinata",
"Neji",
"Shikamaru",
"Gaara",
"Random Shinobi"
];

const rivals = [
"Uchiha Prodigy",
"Hyuga Genius",
"Future Kage",
"Rogue Ninja",
"Akatsuki Recruit",
"Otsutsuki Vessel"
];

const beasts = [
"None",
"Shukaku",
"Matatabi",
"Isobu",
"Son Goku",
"Kokuo",
"Saiken",
"Chomei",
"Gyuki",
"Kurama"
];

let player = {
age:5,
clan:"?",
village:"?",
nature:"?",
eyes:"?",
rank:"?",
master:"?",
friend:"?",
rival:"?",
beast:"?"
};

function random(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

function log(text){
const box = document.getElementById("timeline");
box.innerHTML += text + "\n";
box.scrollTop = box.scrollHeight;
}

function updateStats(){

document.getElementById("stats").innerHTML = `
<p><b>Age:</b> ${player.age}</p>
<p><b>Clan:</b> ${player.clan}</p>
<p><b>Village:</b> ${player.village}</p>
<p><b>Nature:</b> ${player.nature}</p>
<p><b>Eyes:</b> ${player.eyes}</p>
<p><b>Rank:</b> ${player.rank}</p>
<p><b>Master:</b> ${player.master}</p>
<p><b>Friend:</b> ${player.friend}</p>
<p><b>Rival:</b> ${player.rival}</p>
<p><b>Tailed Beast:</b> ${player.beast}</p>
`;

}

function spinWheel(result, callback){

const wheel = document.getElementById("wheel");

wheel.innerHTML = "SPINNING...";

const rotation = 1800 + Math.floor(Math.random()*720);

wheel.style.transform = `rotate(${rotation}deg)`;

setTimeout(()=>{
wheel.innerHTML = result;
callback();
},3000);

}
  function spinClan(){

const result = random(clans);

spinWheel(result, ()=>{
player.clan = result;
log("Clan: " + result);
updateStats();
});

}

function spinVillage(){

const result = random(villages);

spinWheel(result, ()=>{
player.village = result;
log("Village: " + result);
updateStats();
});

}

function spinNature(){

const result = random(natures);

spinWheel(result, ()=>{
player.nature = result;
log("Nature: " + result);
updateStats();
});

}

function spinEyes(){

const result = random(eyes);

spinWheel(result, ()=>{
player.eyes = result;
log("Eyes: " + result);
updateStats();
});

}

function spinRank(){

const result = random(ranks);

spinWheel(result, ()=>{
player.rank = result;
log("Rank: " + result);
updateStats();
});

}

function spinMaster(){

const result = random(masters);

spinWheel(result, ()=>{
player.master = result;
log("Master: " + result);
updateStats();
});

}

function spinFriend(){

const result = random(friends);

spinWheel(result, ()=>{
player.friend = result;
log("Friend: " + result);
updateStats();
});

}

function spinRival(){

const result = random(rivals);

spinWheel(result, ()=>{
player.rival = result;
log("Rival: " + result);
updateStats();
});

}

function spinBeast(){

const result = random(beasts);

spinWheel(result, ()=>{
player.beast = result;
log("Tailed Beast: " + result);
updateStats();
});

}
function evolveEyes(){

if(player.eyes === "Sharingan 1 Tomoe"){
player.eyes = "Sharingan 2 Tomoe";
log("Your Sharingan evolved to 2 Tomoe!");
}

else if(player.eyes === "Sharingan 2 Tomoe"){
player.eyes = "Sharingan 3 Tomoe";
log("Your Sharingan evolved to 3 Tomoe!");
}

else if(player.eyes === "Sharingan 3 Tomoe"){
player.eyes = "Mangekyo Sharingan";
log("You awakened the Mangekyo Sharingan!");
}

else if(player.eyes === "Mangekyo Sharingan"){
player.eyes = "Eternal Mangekyo Sharingan";
log("You obtained the Eternal Mangekyo Sharingan!");
}

else if(player.eyes === "Eternal Mangekyo Sharingan"){
player.eyes = "Rinnegan";
log("You awakened the Rinnegan!");
}

else if(player.eyes === "Rinnegan"){
log("Your eyes are already at their highest evolution!");
}

else{
log("You cannot evolve these eyes.");
}

updateStats();

}
function nextYear(){

player.age++;

const events = [
"Trained hard.",
"Completed a mission.",
"Met a rival.",
"Learned chakra control.",
"Protected the village.",
"Found a mentor.",
"Unlocked new potential."
];

log("Age " + player.age + ": " + random(events));

updateStats();

}

updateStats();

</script>

</body>
</html>
